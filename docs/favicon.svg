<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Name: favicon.svg
    Purpose: The PI mark: pi inside a ring that never closes.
    Description: The open ring is the identity of the whole project; the
      digits never end, so neither does the circle. Matches the inline logo
      in docs/index.html and the social preview card.
    License: MIT
    Author: Amey Thakur (https://github.com/Amey-Thakur)
    Date: 2026-07-18
  -->
  <rect width="64" height="64" rx="14" fill="#0b0d12"/>
  <circle cx="32" cy="33" r="22" fill="none" stroke="#e6b357" stroke-width="4.5"
          stroke-linecap="round" stroke-dasharray="126 999" transform="rotate(-55 32 33)"/>
  <text x="32" y="42.5" text-anchor="middle" font-family="Georgia, serif"
        font-size="27" fill="#e6b357">&#x3C0;</text>
</svg>
